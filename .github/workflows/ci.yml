name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOCKER_IMAGE: elianmartinez157/facturazo-erp.pdf-services

jobs:
  # ===========================================
  # Build & Test - Single compilation for everything
  # ===========================================
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, linux, x64, pdf-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          source $HOME/.cargo/env
          rustup component add clippy rustfmt
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          source $HOME/.cargo/env
          cargo fmt --all -- --check

      - name: Build release binary
        run: |
          source $HOME/.cargo/env
          cargo build --release --bin api
        timeout-minutes: 10

      - name: Run Clippy (on already compiled code)
        run: |
          source $HOME/.cargo/env
          cargo clippy --release --all-targets -- -D warnings
        continue-on-error: true

      - name: Run tests (reuses compilation)
        run: |
          source $HOME/.cargo/env
          cargo test --release --all-targets -- --test-threads=4
        timeout-minutes: 5

      - name: Strip and prepare binary
        run: |
          strip target/release/api
          mkdir -p artifacts
          cp target/release/api artifacts/pdf-service
          ls -lh artifacts/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-service-binary
          path: artifacts/pdf-service
          retention-days: 1

  # ===========================================
  # Security Audit (runs in parallel)
  # ===========================================
  security:
    name: Security Audit
    runs-on: [self-hosted, linux, x64, pdf-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          source $HOME/.cargo/env
          cargo audit 2>/dev/null || true
        continue-on-error: true

  # ===========================================
  # Docker Build & Push - Uses pre-built binary
  # ===========================================
  docker:
    name: Docker Build & Push
    runs-on: [self-hosted, linux, x64, pdf-services]
    needs: [build-and-test]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-service-binary
          path: artifacts

      - name: Prepare binary
        run: |
          chmod +x artifacts/pdf-service
          ls -lh artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tags=${{ env.DOCKER_IMAGE }}:prod-latest,${{ env.DOCKER_IMAGE }}:${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=${{ env.DOCKER_IMAGE }}:dev-latest,${{ env.DOCKER_IMAGE }}:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "tags=${{ env.DOCKER_IMAGE }}:${BRANCH_NAME}-latest,${{ env.DOCKER_IMAGE }}:${BRANCH_NAME}-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed with tags - ${{ steps.tags.outputs.tags }}"

  # ===========================================
  # Deploy to Dev (main branch only)
  # ===========================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: [self-hosted, linux, x64, pdf-services]
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to monitoring server
        run: |
          echo "=== Deploying to Dev Environment ==="

          docker pull ${{ env.DOCKER_IMAGE }}:dev-latest
          docker stop facturazo-pdf-static 2>/dev/null || true
          docker rm facturazo-pdf-static 2>/dev/null || true

          cd /opt/facturazo-static && docker compose up -d pdf-service

          echo "Waiting for service..."
          sleep 5

          for i in {1..10}; do
            if docker exec facturazo-pdf-static wget -qO- http://localhost:8080/health 2>/dev/null | grep -q "healthy"; then
              echo "✓ Deploy successful!"
              exit 0
            fi
            sleep 2
          done

          echo "Service started (health check pending)"
          docker logs facturazo-pdf-static --tail 10
