name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOCKER_IMAGE: elianmartinez157/facturazo-erp.pdf-services

jobs:
  # ===========================================
  # Lint Job - Code quality checks
  # ===========================================
  lint:
    name: Lint & Format
    runs-on: [self-hosted, linux, x64, pdf-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          source $HOME/.cargo/env
          rustup component add clippy rustfmt

      - name: Check formatting
        run: |
          source $HOME/.cargo/env
          cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          source $HOME/.cargo/env
          cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

  # ===========================================
  # Test Job - Runs all tests (also validates compilation)
  # ===========================================
  test:
    name: Test
    runs-on: [self-hosted, linux, x64, pdf-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          source $HOME/.cargo/env
          rustc --version

      - name: Install Typst
        run: |
          if ! command -v typst &> /dev/null; then
            echo "Installing Typst..."
            curl -fsSL https://typst.community/typst-install/install.sh | sh
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "Typst already installed: $(typst --version)"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Run tests
        run: |
          source $HOME/.cargo/env
          export PATH="$HOME/.local/bin:$PATH"
          typst --version
          cargo test --all-targets -- --test-threads=4
        timeout-minutes: 10

      - name: Run doc tests
        run: |
          source $HOME/.cargo/env
          cargo test --doc
        timeout-minutes: 5

  # ===========================================
  # Security Job - Audit dependencies
  # ===========================================
  security:
    name: Security Audit
    runs-on: [self-hosted, linux, x64, pdf-services]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          source $HOME/.cargo/env
          cargo install cargo-audit --quiet || true

      - name: Run security audit
        run: |
          source $HOME/.cargo/env
          cargo audit || true
        continue-on-error: true

  # ===========================================
  # Docker Build & Push - Build and push Docker image
  # ===========================================
  docker:
    name: Docker Build & Push
    runs-on: [self-hosted, linux, x64, pdf-services]
    needs: [test, lint]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Release event -> prod tags
            echo "tags=${{ env.DOCKER_IMAGE }}:prod-latest,${{ env.DOCKER_IMAGE }}:${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Push to main -> dev-latest
            echo "tags=${{ env.DOCKER_IMAGE }}:dev-latest,${{ env.DOCKER_IMAGE }}:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
          else
            # Other branches (develop, v2-microservice) -> branch-specific
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "tags=${{ env.DOCKER_IMAGE }}:${BRANCH_NAME}-latest,${{ env.DOCKER_IMAGE }}:${BRANCH_NAME}-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Image digest
        run: |
          echo "Image pushed with tags: ${{ steps.tags.outputs.tags }}"
          echo "Environment: ${{ steps.tags.outputs.environment }}"

  # ===========================================
  # Deploy Job - Deploy to production (main only)
  # ===========================================
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux, x64, pdf-services]
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "=== Deployment Ready ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ env.DOCKER_IMAGE }}:dev-latest"
          echo ""
          echo "To deploy manually:"
          echo "  docker pull ${{ env.DOCKER_IMAGE }}:dev-latest"
          echo "  docker-compose up -d"
