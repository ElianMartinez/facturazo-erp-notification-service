[package]
name = "pdf-services"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# ============================================
# Core & Async Runtime
# ============================================
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# ============================================
# Web Framework (Actix-web)
# ============================================
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"
actix-ws = "0.2"
actix-web-httpauth = "0.8"
actix-files = "0.6"
tracing-actix-web = "0.7"

# ============================================
# Message Queue (Kafka)
# ============================================
rdkafka = { version = "0.36", features = ["ssl", "sasl", "libz"] }

# ============================================
# Database (SQLite con SQLx)
# ============================================
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "uuid", "chrono", "migrate"] }

# ============================================
# In-Memory Cache
# ============================================
dashmap = "5.5"
moka = { version = "0.12", features = ["future"] }
parking_lot = "0.12"

# ============================================
# Document Generation
# ============================================
# Excel Generation
rust_xlsxwriter = { version = "0.62", features = ["chrono", "zlib"] }

# CSV Generation
csv = "1.3"

# QR Code
qrcode = "0.14"
image = "0.24"

# Templates (mantener compatibilidad)
minijinja = { version = "1.0", features = ["builtins"] }
tera = "1.19"
handlebars = "5.1"

# ============================================
# Notifications
# ============================================
# Email (SMTP)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# ============================================
# Storage (Cloudflare R2 - S3 Compatible)
# ============================================
aws-sdk-s3 = "1.15"
aws-config = "1.1"
aws-credential-types = "1.1"

# ============================================
# HTTP Client (Para EvolutionAPI)
# ============================================
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls", "stream", "multipart"] }

# ============================================
# Serialization
# ============================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# ============================================
# Date/Time
# ============================================
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# ============================================
# UUID & IDs
# ============================================
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
nanoid = "0.4"

# ============================================
# Logging & Observability
# ============================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
opentelemetry = { version = "0.21", optional = true }
opentelemetry-otlp = { version = "0.14", optional = true }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# ============================================
# Configuration
# ============================================
config = "0.14"
dotenv = "0.15"
envy = "0.4"

# ============================================
# Error Handling
# ============================================
thiserror = "1.0"
anyhow = "1.0"
color-eyre = "0.6"

# ============================================
# Validation
# ============================================
validator = { version = "0.18", features = ["derive"] }

# ============================================
# Security & Auth
# ============================================
jsonwebtoken = "9.2"
argon2 = "0.5"
ring = "0.17"
base64 = "0.21"

# Rate Limiting & Circuit Breaker
governor = "0.6"
tower = { version = "0.4", features = ["limit", "timeout", "buffer"] }

# ============================================
# Utilities
# ============================================
# Compression
flate2 = "1.0"
zstd = "0.13"

# Command Line
clap = { version = "4.4", features = ["derive", "env"] }

# Random
rand = "0.8"

# Regex
regex = "1.10"
once_cell = "1.19"

# Other
bytes = "1.5"

# ============================================
# Development Dependencies
# ============================================
[dev-dependencies]
mockall = "0.12"
fake = { version = "2.9", features = ["derive"] }
rstest = "0.18"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
insta = "1.34"
# wiremock = "0.6"  # Temporarily disabled due to compilation issues

# ============================================
# Build Dependencies
# ============================================
[build-dependencies]
vergen = { version = "8.2", features = ["build", "git", "gitcl"] }

# ============================================
# Features
# ============================================
[features]
default = ["sqlite", "evolution-api"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
evolution-api = []
telemetry = ["opentelemetry", "opentelemetry-otlp"]

# ============================================
# Profile Configurations
# ============================================
[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.bench]
inherits = "release"

# ============================================
# Binary Targets (mantener compatibilidad)
# ============================================
[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "quotation-generator"
path = "src/bin/quotation_generator.rs"

[[bin]]
name = "pdf-services"
path = "src/bin/pdf_services.rs"

[[bin]]
name = "benchmark-report"
path = "src/bin/benchmark_report.rs"

[[bin]]
name = "kafka-worker"
path = "src/bin/kafka_worker.rs"

[[bin]]
name = "local-test"
path = "src/bin/local_test.rs"

[lib]
name = "pdf_services"
path = "src/lib.rs"

# ============================================
# Examples
# ============================================
[[example]]
name = "test_whatsapp"
path = "examples/test_whatsapp.rs"

